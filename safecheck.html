<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">

		<meta name="keywords" content="琉璃玩家,LIULIWANJIA,琉璃酸酸,琉酸,琉璃云,LIUSUCloud" />
		<title>网络可用性检测中 - H2SO4 V7.2</title>
		<link rel="icon" href="/favicon.png" type="image/x-icon" />
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				background-color: #f5f7fa;
				color: #4a5568;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 90vh;
				margin: 0;
				padding: 1rem;
				line-height: 1.6;
				overflow-y: hidden;
			}

			.container {
				background-color: #ffffff;
				border-radius: 1rem;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
				max-width: 600px;
				width: 100%;
				padding: 2.5rem;
				text-align: left;
			}


			.contact {
				margin-top: 2rem;
				padding-top: 1.5rem;
				border-top: 1px solid #edf2f7;
				color: #718096;
			}

			.contact a {
				color: #00BBFF;
				text-decoration: none;
			}
			
			.message span a {
				color: #5a67d8;

			.message span a:hover {

			.signature {

			@media (max-width: 639px) {

				}

				.message {
					font-size: 1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div style="display: flex; align-items: center; margin-bottom: 2rem;">
				<img src="/favicon.png" alt="logo" style="width:32px;height:32px;margin-right:0.75rem;">
				<span style="font-size:1.4rem;font-weight:600;color:#2d3748;">H2SO4 V7.2 - <span id="info">网络检测中 请稍等</span></span>
			</div>
			<div class="message" id="message">
			    <span id="jinrishici-sentence">........</span>
                <script src="https://sdk.jinrishici.com/v2/browser/jinrishici.js" charset="utf-8"></script>
			</div>
			<div class="contact">
				站长邮箱：<a href="mailto:jiushi3211901@gmail.com">jiushi3211901@gmail.com</a>
			</div>
			<div class="signature">
				琉璃玩家
				<br />
			</div>
		</div>
<script type="text/javascript">
// 定义全局变量
let httpsUrls = [];
let httpUrls = [];
let availableUrls = []; // 存储检测成功的HTTPS URL
const TIMEOUT_DURATION = 3000; // 检测超时时间(毫秒)

// 页面加载完成后执行初始化
document.addEventListener('DOMContentLoaded', function() {
    // 更新页面状态提示
    document.getElementById('info').textContent = '网络检测中';
    
    // 获取JSON数据并开始检测
    fetch('data.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('获取JSON数据失败: ' + response.status);
            }
            return response.json();
        })
        .then(urls => {
            // 分离HTTP和HTTPS网址
            urls.forEach(url => {
                // 标准化URL格式
                const normalizedUrl = url.replace(/\/+$/, '');
                
                if (normalizedUrl.startsWith('https://')) {
                    httpsUrls.push(normalizedUrl);
                } else if (normalizedUrl.startsWith('http://')) {
                    httpUrls.push(normalizedUrl);
                }
            });
            
            // 如果有HTTPS网址则开始检测，否则直接显示HTTP备用地址
            if (httpsUrls.length > 0) {
                testAllHttpsUrls();
            } else {
                showHttpUrls();
            }
        })
        .catch(error => {
            console.error('加载JSON文件失败:', error);
            showHttpUrls();
        });
});

/**
 * 测试所有HTTPS URL的延迟
 */
function testAllHttpsUrls() {
    const testPromises = httpsUrls.map(url => 
        testLatency(url).then(latency => {
            return {url, latency};
        }).catch(() => null) // 检测失败返回null
    );
    
    // 等待所有检测完成
    Promise.all(testPromises).then(results => {
        // 过滤出成功的检测结果
        availableUrls = results.filter(result => result !== null);
        
        if (availableUrls.length > 0) {
            // 随机选择一个可用的URL
            const randomIndex = Math.floor(Math.random() * availableUrls.length);
            const selectedUrl = availableUrls[randomIndex].url;
            
            // 更新状态并跳转
            document.getElementById('info').textContent = '检测成功，正在跳转';
            setTimeout(() => {
                window.location.href = selectedUrl; // 当前页面跳转
            }, 500);
        } else {
            // 所有HTTPS检测失败，显示HTTP备用地址
            showHttpUrls();
        }
    });
}

/**
 * 测试单个URL的网络延迟
 * @param {string} url 要测试的URL
 * @returns {Promise<number>} 延迟时间（毫秒）
 */
function testLatency(url) {
    return new Promise((resolve, reject) => {
        const startTime = Date.now();
        let timeoutId = null;
        
        // 使用no-cors模式避免CORS预检请求
        fetch(url, {
            method: 'HEAD',
            mode: 'no-cors',
            cache: 'no-store'
        })
        .then(() => {
            // 清除超时计时器
            if (timeoutId) clearTimeout(timeoutId);
            
            const endTime = Date.now();
            const latency = endTime - startTime;
            resolve(latency);
        })
        .catch(error => {
            if (timeoutId) clearTimeout(timeoutId);
            reject(new Error('请求失败'));
        });
        
        // 设置超时
        timeoutId = setTimeout(() => {
            reject(new Error('请求超时'));
        }, TIMEOUT_DURATION);
    });
}

/**
 * 显示所有HTTP备用地址
 */
function showHttpUrls() {
    document.getElementById('info').textContent = '使用备用地址';
    const messageDiv = document.getElementById('message');
    
    // 清空原有内容
    messageDiv.innerHTML = '';
    
    if (httpUrls.length === 0) {
        messageDiv.innerHTML = '无可用备用地址';
        return;
    }
    
    // 创建备用地址列表
    const list = document.createElement('div');
    httpUrls.forEach((url, index) => {
        const link = document.createElement('a');
        link.href = url;
        link.textContent = `备用地址 - ${index + 1}`;
        link.target = '_blank';  // 新标签页打开
        link.style.display = 'block';
        link.style.marginBottom = '0.5rem';
        link.style.color = '#5a67d8';
        link.style.textDecoration = 'none';
        
        link.addEventListener('mouseover', () => {
            link.style.color = '#00FFCC';
        });
        link.addEventListener('mouseout', () => {
            link.style.color = '#5a67d8';
        });
        
        list.appendChild(link);
    });
    
    // 添加说明文本
    const info = document.createElement('p');
    info.textContent = '以下备用地址将在新标签页打开:';
    info.style.marginBottom = '1rem';
    
    messageDiv.appendChild(info);
    messageDiv.appendChild(list);
}
</script>
	</body>
</html>
